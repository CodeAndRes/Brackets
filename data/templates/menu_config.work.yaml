# Configuración de menús para Vault de Trabajo (Work)
# Personalizable: puedes reordenar opciones, cambiar atajos (keys) y editar títulos.

menus:
  main:
    title: "M E N U  P R I N C I P A L  ( T R A B A J O )"
    items:
      - id: daily_hub
        label: "Hub Diario (Gestion de la Jornada)"
        keys: ["1", "d"]
        action: exec
        command: open_daily_hub
        context_tag: bitacoras_enabled

      - id: project_backlog
        label: "Proyectos, Backlog e Ideas"
        keys: ["2", "p"]
        action: exec
        command: open_project_backlog

      - id: notes_crud
        label: "Gestion de Notas (CRUD)"
        keys: ["3", "n"]
        action: exec
        command: open_notes_crud

      - id: generation
        label: "Generacion de Bitacoras"
        keys: ["4", "b"]
        action: exec
        command: open_generation
        context_tag: bitacoras_enabled

      - id: consolidation
        label: "Consolidacion de Archivos"
        keys: ["5", "c"]
        action: exec
        command: open_consolidation
        context_tag: bitacoras_enabled

      - id: files
        label: "Gestion de Archivos y Categorias"
        keys: ["6", "f"]
        action: exec
        command: open_file_management

      - id: tools
        label: "Herramientas y Utilidades"
        keys: ["7", "t"]
        action: exec
        command: open_tools

      - id: settings
        label: "Configuracion"
        keys: ["8", "s"]
        action: exec
        command: open_settings

      - id: help
        label: "Ayuda"
        keys: ["9", "h"]
        action: exec
        command: open_help

      - id: quick_new_weekly
        label: "Nueva bitacora semanal (atajo)"
        keys: ["w"]
        action: exec
        command: quick_new_weekly
        context_tag: active_vault

      - id: quick_consolidate_month
        label: "Consolidar mes (atajo)"
        keys: ["m"]
        action: exec
        command: quick_consolidate_month
        context_tag: active_vault

      - id: exit
        label: "Salir"
        keys: ["0", "q", "x"]
        action: exec
        command: exit

  generation:
    title: "G E N E R A C I O N  D E  B I T A C O R A S"
    items:
      - id: weekly_auto
        label: "Crear bitacora semanal"
        keys: ["1", "w"]
        action: exec
        command: create_weekly
      - id: weekly_manual
        label: "Crear bitacora semanal manual"
        keys: ["2", "a"]
        action: exec
        command: create_weekly_manual
      - id: monthly
        label: "Crear archivo mensual"
        keys: ["3", "m"]
        action: exec
        command: create_monthly
      - id: back
        label: "Volver al menu principal"
        keys: ["0", "v", "b"]
        action: exec
        command: back

  consolidation:
    title: "C O N S O L I D A C I O N  D E  A R C H I V O S"
    items:
      - id: consolidate_month
        label: "Consolidar mes completo"
        keys: ["1", "m"]
        action: exec
        command: consolidate_month
      - id: consolidate_year
        label: "Consolidar anio completo"
        keys: ["2", "y"]
        action: exec
        command: consolidate_year
      - id: back
        label: "Volver al menu principal"
        keys: ["0", "v", "b"]
        action: exec
        command: back

  file_management:
    title: "G E S T I O N  D E  A R C H I V O S  Y  C A T E G O R I A S"
    items:
      - id: list
        label: "Listar archivos recientes"
        keys: ["1", "l"]
        action: exec
        command: list_files
      - id: analyze
        label: "Analizar archivo especifico"
        keys: ["2", "a"]
        action: exec
        command: analyze_file
      - id: categories
        label: "Gestionar categorias y documentos"
        keys: ["3", "g"]
        action: exec
        command: manage_categories
      - id: replace
        label: "Busqueda y reemplazo global"
        keys: ["4", "r"]
        action: exec
        command: global_replace
      - id: sync_yaml
        label: "Sincronizar YAML con repositorio"
        keys: ["5", "s"]
        action: exec
        command: sync_yaml
      - id: add_task
        label: "Anadir tarea rapida"
        keys: ["6", "t"]
        action: exec
        command: add_task
      - id: back
        label: "Volver al menu principal"
        keys: ["0", "v", "b"]
        action: exec
        command: back

  tools:
    title: "H E R R A M I E N T A S  Y  U T I L I D A D E S"
    items:
      - id: pomodoro
        label: "Pomodoro Timer"
        keys: ["1", "p"]
        action: exec
        command: tool_pomodoro
      - id: analyze_content
        label: "Analizar contenido de archivo"
        keys: ["2", "a"]
        action: exec
        command: tool_analyze_content
      - id: debug_files
        label: "Debug archivos en directorio"
        keys: ["3", "d"]
        action: exec
        command: tool_debug_files
      - id: emoji_pattern
        label: "Probar patron de emojis"
        keys: ["4", "e"]
        action: exec
        command: tool_emoji
      - id: calc_dates
        label: "Calcular fechas de archivo"
        keys: ["5", "f"]
        action: exec
        command: tool_calc_dates
      - id: back
        label: "Volver al menu principal"
        keys: ["0", "v", "b"]
        action: exec
        command: back

  list:
    title: "L I S T A R  A R C H I V O S"
    items:
      - id: list_weekly
        label: "Bitacoras semanales"
        keys: ["1", "w"]
        action: exec
        command: list_weekly
      - id: list_monthly
        label: "Archivos mensuales"
        keys: ["2", "m"]
        action: exec
        command: list_monthly
      - id: list_debug
        label: "Debug - Todos los archivos"
        keys: ["3", "d"]
        action: exec
        command: list_debug
      - id: back
        label: "Volver"
        keys: ["0", "v", "b"]
        action: exec
        command: back

  configuration:
    title: "C O N F I G U R A C I O N"
    items:
      - id: view
        label: "Ver configuracion actual"
        keys: ["1", "v"]
        action: exec
        command: config_view
      - id: work_pattern
        label: "Ajustar patron de trabajo"
        keys: ["2", "p"]
        action: exec
        command: config_work_pattern
      - id: holidays
        label: "Gestionar festivos"
        keys: ["3", "f"]
        action: exec
        command: config_holidays
      - id: vacations
        label: "Gestionar vacaciones"
        keys: ["4", "a"]
        action: exec
        command: config_vacations
      - id: back
        label: "Volver al menu principal"
        keys: ["0", "b", "v"]
        action: exec
        command: back
