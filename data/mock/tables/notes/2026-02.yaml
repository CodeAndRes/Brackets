- id: NOTE-0014
  title: Reunión de Estructura Confluence Lisa friendly
  content:
  - El equipo de AI Academy + @NicolasBernardMartinez nos comentan las pautas a seguir
    para una primera versión de reestructuración
  - del espacio de Confluence de CDOs.
  - Siempre poner un titulo 1 dentro del documento con el mismo nombre del documento
  - Crear una jerarquía de titulos y subtitulos clara y consistente.
  - 'Inicialmente @EricGarcia comentaba la idea de dividir el espacio en 2 secciones:
    una para flujos y otra para incidencias.'
  - Nos comentan que lo ideal es crear una estructura donde esten las incidencias
    asociadas a los flujos correspondientes,
  - con esto se facilita la navegación y la búsqueda de información relacionada.
  - '@EricGarcia hará una primera versión de estructura de archivo Confluence y nos
    volveremos a sentar para ver que tan bien es'
