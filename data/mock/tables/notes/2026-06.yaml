- id: NOTE-0136
  title: Alta de usuarios de Grafana de CDOs
  content:
  - Para que usuarios externos de CDOs puedan acceder a la organización de Grafana,
    tienen que pertenecer a un grupo de AD
  - Este grupo de AD se tiene que configurar en Grafana para que los usuarios que
    pertenezcan a ese grupo tengan acceso a la organización de Grafana de CDOs
  - He pedido la creación del grupo de AD para usuarios de solo visualización Grafana
    CDOs
  - Peti vinculación de grupo a Grafana-CDOs
  - '```text'
  - Hola,
  - Necesitamos configurar el acceso LDAP para la organización CDO en Grafana.
  - Por favor, mapead el grupo de AD app_grafanak8s_cdo_viewer a la organización CDO
    con rol Viewer.
  - Los usuarios deben autenticarse únicamente con su usuario corporativo vía LDAP,
    sin invitaciones ni contraseñas locales. Además, los miembros de este grupo no
    deberían tener acceso a la organización principal de Grafana.
  - ¿Podéis revisar también que no exista una autoasignación o mapeo genérico que
    les dé acceso a la organización principal?
  - Gracias.
  - '```'
  created_at: '2026-06-01'
  month: 2026-06
  week: 23
  project_id: METRICS_INFLUXDB
