- id: NOTE-0059
  title: Proyecto ExcelOff
  content:
  - 💬Mensaje @PieroJaramillo
  - '```'
  - Hola Piero, buenas tardes.
  - Nos han comentado que eres la persona de contacto para temas de Power BI, y queríamos
    comentarte que estamos investigando su uso
  - para un proyecto de migración de unos reports generados en Excel que actualmente
    se envían manualmente por email a los responsables
  - de Supply de Lliçà.
  - Tenemos entendido que, para poder programar el envío de reports por email en Power
    BI, es necesaria una licencia con coste. ¿Podrías
  - indicarnos cómo funciona el tema de licencias y si tenemos disponibilidad?
  - Si te parece, lo comentamos en una llamada y te doy un poco más de detalle.
  - Gracias y un saludo,
  - '```'
  - '@PieroJaramillo nos comenta que con las licencias que tenemos los intyernos de
    mango podemos crear el flujo completo de creación de report'
  - y envío por email.
  - La idea es empezar por una prueba de concepto con un report sencillo para luego
    ir migrando el resto de reports.
  created_at: '2026-03-01'
  month: 2026-03
  week: 11
