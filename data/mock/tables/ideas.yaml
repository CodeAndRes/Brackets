- id: IDEA-0010
  title: Priorizar la creación de tareas de forma agíl y persistente.
  content:
  - Las tareas deben tener una estructura gerarquica cuando pertyenzcan aun proyuecto
    y perteneces a un mes,semana y dia
  - Si las tareas no se realizan en su tiempo, deben traspasarse al dia,semana o mes
    siguiente
  - Las tareas no solo deben existir en una linea en un archivo .md, deben ser una
    entidad u objeto que debe tener sus
  status: evaluating
  created_at: '2026-08-24'
  project_id: GENERAL
